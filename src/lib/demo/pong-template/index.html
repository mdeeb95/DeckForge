<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — DeckForge Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
  canvas { display: block; image-rendering: pixelated; }
  #status { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #555; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div id="status">Connecting...</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let CW = 800, CH = 600;
let role = null;
let state = null;
let ws = null;
const input = { up: false, down: false };

// ─── Menu State ─────────────────────────────────────────────────────
let menuScreen = 'mode'; // 'mode' | 'difficulty' | null (in-game)
let menuSelection = 0;   // Index of highlighted option
const modeOptions = ['1 Player (vs AI)', '2 Players'];
const difficultyOptions = ['Easy', 'Medium', 'Hard'];
let selectedMode = '2p';
let selectedDifficulty = 'medium';

// ─── Resize ──────────────────────────────────────────────────────────
function resize() {
  const scaleX = window.innerWidth / CW;
  const scaleY = window.innerHeight / CH;
  const scale = Math.min(scaleX, scaleY);
  canvas.width = CW;
  canvas.height = CH;
  canvas.style.width = (CW * scale) + 'px';
  canvas.style.height = (CH * scale) + 'px';
}
window.addEventListener('resize', resize);

// ─── WebSocket ───────────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => { statusEl.textContent = 'Connected — waiting for assignment...'; };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'assign') {
      role = data.role;
      CW = data.canvas.w;
      CH = data.canvas.h;
      resize();
      // Restore mode state from server
      if (data.gameStarted) {
        menuScreen = null;
      } else {
        menuScreen = 'mode';
        menuSelection = 0;
      }
      selectedMode = data.gameMode || '2p';
      selectedDifficulty = data.aiDifficulty || 'medium';
      statusEl.textContent = role === 'spectator' ? 'Spectating' : `You are Player ${role}`;
      setTimeout(() => { statusEl.textContent = ''; }, 3000);
      return;
    }
    state = data;
    // Sync menu state from server broadcasts
    if (!state.gameStarted && menuScreen === null) {
      menuScreen = 'mode';
      menuSelection = 0;
    }
    if (state.gameStarted && menuScreen !== null) {
      menuScreen = null;
    }
  };

  ws.onclose = () => {
    statusEl.textContent = 'Disconnected — reconnecting...';
    role = null;
    state = null;
    setTimeout(connect, 1500);
  };
}
connect();

// ─── Input: Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Menu navigation
  if (menuScreen && role === 1) {
    const opts = menuScreen === 'mode' ? modeOptions : difficultyOptions;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      menuSelection = (menuSelection - 1 + opts.length) % opts.length;
      e.preventDefault();
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      menuSelection = (menuSelection + 1) % opts.length;
      e.preventDefault();
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      handleMenuSelect();
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape' || e.key === 'Backspace') {
      if (menuScreen === 'difficulty') {
        menuScreen = 'mode';
        menuSelection = 0;
      }
      e.preventDefault();
      return;
    }
    return;
  }

  // Game input
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') input.up = true;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') input.down = true;
  if (e.key === 'r' || e.key === 'R') {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ restart: true }));
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') input.up = false;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') input.down = false;
});

// ─── Input: Touch (Steam Deck browser) ──────────────────────────────
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (menuScreen && role === 1) {
    for (const t of e.touches) {
      if (t.clientY < window.innerHeight / 2) {
        const opts = menuScreen === 'mode' ? modeOptions : difficultyOptions;
        menuSelection = (menuSelection - 1 + opts.length) % opts.length;
      } else {
        const opts = menuScreen === 'mode' ? modeOptions : difficultyOptions;
        menuSelection = (menuSelection + 1) % opts.length;
      }
    }
    return;
  }
  for (const t of e.touches) {
    if (t.clientY < window.innerHeight / 2) input.up = true;
    else input.down = true;
  }
});
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  input.up = false;
  input.down = false;
  for (const t of e.touches) {
    if (t.clientY < window.innerHeight / 2) input.up = true;
    else input.down = true;
  }
});

// Double-tap to select in menu
let lastTapTime = 0;
canvas.addEventListener('touchstart', (e) => {
  if (!menuScreen || role !== 1) return;
  const now = Date.now();
  if (now - lastTapTime < 400) {
    handleMenuSelect();
  }
  lastTapTime = now;
});

// ─── Menu Selection Handler ─────────────────────────────────────────
function handleMenuSelect() {
  if (menuScreen === 'mode') {
    if (menuSelection === 0) {
      // 1 Player selected
      selectedMode = '1p';
      menuScreen = 'difficulty';
      menuSelection = 1; // Default to Medium
    } else {
      // 2 Player selected — start immediately
      selectedMode = '2p';
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ setMode: '2p' }));
        ws.send(JSON.stringify({ startGame: true }));
      }
      menuScreen = null;
    }
  } else if (menuScreen === 'difficulty') {
    const diffs = ['easy', 'medium', 'hard'];
    selectedDifficulty = diffs[menuSelection];
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ setMode: '1p', aiDifficulty: selectedDifficulty }));
      ws.send(JSON.stringify({ startGame: true }));
    }
    menuScreen = null;
  }
}

// ─── Send Input ──────────────────────────────────────────────────────
setInterval(() => {
  if (ws && ws.readyState === 1 && role !== 'spectator' && !menuScreen) {
    ws.send(JSON.stringify(input));
  }
}, 1000 / 60);

// ─── Draw Menu ──────────────────────────────────────────────────────
function drawMenu() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, CH);

  // Title
  ctx.fillStyle = '#0df2f2';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PONG', CW / 2, 120);

  // Subtitle
  ctx.fillStyle = '#555';
  ctx.font = '16px monospace';
  if (menuScreen === 'mode') {
    ctx.fillText('Select Game Mode', CW / 2, 170);
  } else {
    ctx.fillText('Select AI Difficulty', CW / 2, 170);
  }

  const opts = menuScreen === 'mode' ? modeOptions : difficultyOptions;
  const startY = 240;
  const lineHeight = 60;

  for (let i = 0; i < opts.length; i++) {
    const y = startY + i * lineHeight;
    const isSelected = i === menuSelection;

    if (isSelected) {
      // Selection box
      const textWidth = 280;
      ctx.fillStyle = 'rgba(13, 242, 242, 0.1)';
      ctx.fillRect(CW / 2 - textWidth / 2, y - 22, textWidth, 44);
      // Left accent bar
      ctx.fillStyle = '#0df2f2';
      ctx.fillRect(CW / 2 - textWidth / 2, y - 22, 3, 44);
      // Arrow indicator
      ctx.fillStyle = '#0df2f2';
      ctx.font = '24px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('>', CW / 2 - textWidth / 2 + 20, y + 8);
    }

    ctx.font = isSelected ? 'bold 24px monospace' : '24px monospace';
    ctx.fillStyle = isSelected ? '#0df2f2' : '#666';
    ctx.textAlign = 'center';
    ctx.fillText(opts[i], CW / 2, y + 8);

    // Difficulty descriptions
    if (menuScreen === 'difficulty') {
      ctx.font = '13px monospace';
      ctx.fillStyle = isSelected ? '#0df2f2' : '#444';
      const descs = [
        'Slow reactions, misses often — great for beginners',
        'Solid tracking, makes some mistakes — fair challenge',
        'Near-perfect aim, fast reflexes — good luck'
      ];
      ctx.fillText(descs[i], CW / 2, y + 28);
    }
  }

  // Controls hint
  ctx.fillStyle = '#333';
  ctx.font = '14px monospace';
  ctx.textAlign = 'center';
  const controlY = CH - 60;
  ctx.fillText('W/S or Arrow Keys to navigate — Enter to select', CW / 2, controlY);
  if (menuScreen === 'difficulty') {
    ctx.fillText('Esc to go back', CW / 2, controlY + 22);
  }

  // Role info
  if (role === 'spectator') {
    ctx.fillStyle = '#444';
    ctx.font = '14px monospace';
    ctx.fillText('You are spectating — Player 1 selects the mode', CW / 2, controlY + 44);
  }
}

// ─── Render ──────────────────────────────────────────────────────────
function draw() {
  // Show menu if game hasn't started
  if (menuScreen && (!state || !state.gameStarted)) {
    drawMenu();
    requestAnimationFrame(draw);
    return;
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, CH);

  // Center dashed line
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CW / 2, 0);
  ctx.lineTo(CW / 2, CH);
  ctx.stroke();
  ctx.setLineDash([]);

  if (!state) {
    ctx.fillStyle = '#555';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Waiting for server...', CW / 2, CH / 2);
    requestAnimationFrame(draw);
    return;
  }

  // Paddles (dynamic height from server)
  const p1H = state.p1PaddleH || 80;
  const p2H = state.p2PaddleH || 80;

  // P1 paddle — glow if size boosted
  if (state.activeEffects && state.activeEffects.sizeboost && state.activeEffects.sizeboost.p1) {
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#00ff88';
  } else {
    ctx.fillStyle = '#fff';
  }
  ctx.fillRect(10, state.p1.y, 12, p1H);
  ctx.shadowBlur = 0;

  // P2 paddle — glow if size boosted
  if (state.activeEffects && state.activeEffects.sizeboost && state.activeEffects.sizeboost.p2) {
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#00ff88';
  } else {
    ctx.fillStyle = '#fff';
  }
  ctx.fillRect(CW - 22, state.p2.y, 12, p2H);
  ctx.shadowBlur = 0;

  // Main Ball — blue tint if frozen
  if (state.activeEffects && state.activeEffects.freeze) {
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#44aaff';
  } else {
    ctx.fillStyle = '#fff';
  }
  ctx.fillRect(state.ball.x, state.ball.y, 10, 10);
  ctx.shadowBlur = 0;

  // Extra Balls (multi-ball) — rendered in magenta
  if (state.extraBalls && state.extraBalls.length > 0) {
    ctx.fillStyle = '#f20dcf';
    ctx.shadowColor = '#f20dcf';
    ctx.shadowBlur = 8;
    for (const eb of state.extraBalls) {
      ctx.fillRect(eb.x, eb.y, 10, 10);
    }
    ctx.shadowBlur = 0;
  }

  // ─── Power-Up on Field ────────────────────────────────────────────
  if (state.powerup) {
    const pu = state.powerup;
    const puSize = 20;
    const puColors = { freeze: '#44aaff', multiball: '#f20dcf', sizeboost: '#00ff88' };
    const puColor = puColors[pu.type] || '#fff';

    // Pulsing glow effect
    const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 200);
    ctx.shadowColor = puColor;
    ctx.shadowBlur = 12 * pulse;

    // Background circle
    ctx.fillStyle = puColor;
    ctx.globalAlpha = 0.2 + 0.15 * pulse;
    ctx.beginPath();
    ctx.arc(pu.x + puSize / 2, pu.y + puSize / 2, puSize * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Icon
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = puColor;
    const icons = { freeze: '\u2744', multiball: '\u2726', sizeboost: '\u2191' };
    ctx.fillText(icons[pu.type] || '?', pu.x + puSize / 2, pu.y + puSize / 2 + 5);
    ctx.shadowBlur = 0;

    // Despawn timer bar beneath powerup
    const elapsed = Date.now() - pu.spawnedAt;
    const remaining = Math.max(0, 1 - elapsed / 5000);
    ctx.fillStyle = puColor;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(pu.x, pu.y + puSize + 4, puSize * remaining, 2);
    ctx.globalAlpha = 1;
  }

  // Scores
  ctx.font = '48px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#444';
  ctx.fillText(state.p1.score, CW / 2 - 60, 60);
  ctx.fillText(state.p2.score, CW / 2 + 60, 60);

  // Player labels
  ctx.font = '12px monospace';
  ctx.fillStyle = '#333';
  ctx.textAlign = 'left';
  ctx.fillText('P1', 10, CH - 10);
  ctx.textAlign = 'right';
  if (state.gameMode === '1p') {
    const diffLabel = (state.aiDifficulty || 'medium').toUpperCase();
    ctx.fillText('AI (' + diffLabel + ')', CW - 10, CH - 10);
  } else {
    ctx.fillText('P2', CW - 10, CH - 10);
  }

  // ─── Active Effect Indicators ──────────────────────────────────────
  if (state.activeEffects) {
    const now = Date.now();
    let indicators = [];

    // Freeze indicator
    if (state.activeEffects.freeze) {
      const rem = Math.max(0, (state.activeEffects.freeze.until - now) / 1000);
      indicators.push({ label: '\u2744 FREEZE', color: '#44aaff', time: rem.toFixed(1) + 's' });
    }

    // Size boost P1
    if (state.activeEffects.sizeboost && state.activeEffects.sizeboost.p1) {
      const rem = Math.max(0, (state.activeEffects.sizeboost.p1.until - now) / 1000);
      indicators.push({ label: 'P1 \u2191 SIZE', color: '#00ff88', time: rem.toFixed(1) + 's' });
    }

    // Size boost P2
    if (state.activeEffects.sizeboost && state.activeEffects.sizeboost.p2) {
      const rem = Math.max(0, (state.activeEffects.sizeboost.p2.until - now) / 1000);
      indicators.push({ label: 'P2 \u2191 SIZE', color: '#00ff88', time: rem.toFixed(1) + 's' });
    }

    // Multi-ball count
    if (state.extraBalls && state.extraBalls.length > 0) {
      indicators.push({ label: '\u2726 MULTI x' + state.extraBalls.length, color: '#f20dcf', time: '' });
    }

    // Draw indicators at top center
    if (indicators.length > 0) {
      const totalW = indicators.length * 130 + (indicators.length - 1) * 10;
      let ix = CW / 2 - totalW / 2;
      for (const ind of indicators) {
        // Pill background
        ctx.fillStyle = ind.color;
        ctx.globalAlpha = 0.15;
        ctx.fillRect(ix, 80, 130, 24);
        ctx.globalAlpha = 1;

        // Left accent
        ctx.fillStyle = ind.color;
        ctx.fillRect(ix, 80, 3, 24);

        // Label text
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = ind.color;
        ctx.fillText(ind.label, ix + 8, 96);

        // Timer text
        if (ind.time) {
          ctx.textAlign = 'right';
          ctx.fillStyle = ind.color;
          ctx.globalAlpha = 0.7;
          ctx.fillText(ind.time, ix + 124, 96);
          ctx.globalAlpha = 1;
        }

        ix += 140;
      }
    }
  }

  // Pause indicator
  if (state.paused) {
    ctx.fillStyle = '#333';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('get ready...', CW / 2, CH / 2 + 40);
  }

  // Winner
  if (state.winner) {
    ctx.fillStyle = '#0df2f2';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    let winText;
    if (state.gameMode === '1p') {
      winText = state.winner === 1 ? 'You win!' : 'AI wins!';
    } else {
      winText = `Player ${state.winner} wins!`;
    }
    ctx.fillText(winText, CW / 2, CH / 2 - 20);
    ctx.fillStyle = '#555';
    ctx.font = '16px monospace';
    ctx.fillText('Press R to return to menu', CW / 2, CH / 2 + 20);
  }

  requestAnimationFrame(draw);
}
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
